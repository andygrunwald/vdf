name: Testing

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "5 1 * * *" # Run nightly
  workflow_dispatch:

jobs:
  gofmt:
    name: go fmt (Go ${{ matrix.go }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        go: [stable, oldstable]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ matrix.go }}

      - name: Run go fmt
        if: runner.os != 'Windows'
        run: diff -u <(echo -n) <(gofmt -d -s .)

  govet:
    name: go vet (Go ${{ matrix.go }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        go: [stable, oldstable]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ matrix.go }}

      - name: Run go vet
        run: make vet

  staticcheck:
    name: staticcheck (Go ${{ matrix.go }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        go: [stable, oldstable]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ matrix.go }}

      - name: Run staticcheck
        uses: dominikh/staticcheck-action@9716614d4101e79b4340dd97b10e54d68234e431 # v1.4.1
        with:
          # renovate: datasource=github-releases depName=dominikh/go-tools
          version: "2026.2.2"
          install-go: false
          cache-key: staticcheck

  unittesting:
    name: unit testing (Go ${{ matrix.go }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        go: [stable, oldstable]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ matrix.go }}

      # Checkout the Fuzzing seed and generated corpus
      # Classical unit tests execute the fuzzing tests as well,
      # but mainly with the pre-existing corpus.
      #
      # Deactivated right now, because this let the unit tests
      # run into an execution timeout.
      #
      #- uses: actions/checkout@v6
      #  with:
      #    repository: andygrunwald/vdf-fuzzing-corpus
      #    path: testdata/fuzz

      - name: Run Unit tests.
        run: make test
